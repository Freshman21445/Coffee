<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/Coffee/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee Trade</title>
    <script>
        (function () {
            var t = localStorage.getItem("thecoffee-theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="app-body">
    <div class="app-shell">
        <iframe id="content-frame" src="Home.html"></iframe>
        <div class="bottom-nav">
            <button class="nav-item active" data-src="Home.html">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item" data-src="VIP.html">
                <span class="nav-icon">⭐</span>
                <span class="nav-label">VIP</span>
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item" data-src="Team.html">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Team</span>
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item" data-src="Task.html">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Task</span>
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item" data-src="Me.html">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Me</span>
                <span class="nav-dot"></span>
            </button>
        </div>
    </div>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/interactive.js"></script>
    <script src="/static/js/main.js"></script>

    <script>
    // Check if user is logged in
    const userId = localStorage.getItem('userId');
    if (!userId) {
        // If not logged in, redirect to login page
        window.location.href = 'login.html';
    }
    </script>
    
</body>
</html>
