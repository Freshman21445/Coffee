<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee Trade</title>
    <meta name="theme-color" content="#b4762a">
    
    <!-- 🔴 1. REDIRECT to login if not logged in -->
    <script>
        if (!localStorage.getItem('userId')) {
            window.location.replace('login.html');
        }
    </script>
    
    <!-- 🔴 2. Apply saved theme -->
    <script>
        (function () {
            var t = localStorage.getItem("thecoffee-theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    
    <!-- 🔴 3. CSS: NO leading slash! -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body class="app-body">

<div class="app-shell">
    <!-- 🔴 4. Load Home.html (NOT /app/home) -->
    <iframe id="content-frame" src="Home.html" title="content"></iframe>

    <!-- 🔴 5. Bottom navigation: points to HTML files, NOT server routes -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-src="Home.html">
            <span class="nav-icon">🏠</span><span class="nav-label">Home</span><span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-src="VIP.html">
            <span class="nav-icon">👑</span><span class="nav-label">VIP</span><span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-src="Team.html">
            <span class="nav-icon">👥</span><span class="nav-label">Team</span><span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-src="Task.html">
            <span class="nav-icon">📋</span><span class="nav-label">Task</span><span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-src="Me.html">
            <span class="nav-icon">👤</span><span class="nav-label">Me</span><span class="nav-dot"></span>
        </button>
    </nav>
</div>

<!-- 🔴 6. JavaScript: NO leading slash! -->
<script src="static/js/theme.js"></script>
<script src="static/js/interactive.js"></script>
<script src="static/js/main.js"></script>
</body>
</html>
