<!DOCTYPE html>
<html>
<head>
    <title>Login Debug</title>
</head>
<body>
    <h1>Login Debug</h1>
    <form id="login-form">
        Email: <input type="text" id="email" placeholder="your@email.com"><br><br>
        Password: <input type="password" id="password" placeholder="password"><br><br>
        <button type="submit">Login</button>
    </form>
    <p id="result" style="white-space: pre-wrap; background: #f0f0f0; padding: 10px;"></p>

    <script>
        const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultBox = document.getElementById('result');

            resultBox.textContent = '⏳ Sending request...';

            try {
                const res = await fetch(WORKER_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                // 🔴 Get the raw response text (this never fails)
                const rawText = await res.text();

                // 🔴 Show the exact status and raw response
                resultBox.textContent = '✅ Status Code: ' + res.status + '\n\n📦 Raw Response:\n' + rawText;

            } catch (err) {
                resultBox.textContent = '❌ Network Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
