<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <!-- Apply saved theme immediately -->
<script>
    const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch(WORKER_URL + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            // 🔴 1. Check if the response is NOT ok (401, 500, etc.)
            if (!res.ok) {
                const errorText = await res.text();
                alert('❌ Server Error (' + res.status + '): ' + errorText);
                return;
            }

            // 🔴 2. Try to parse the JSON
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('username', data.username);
                localStorage.setItem('balance', data.balance);
                window.location.href = 'index.html';
            } else {
                // 🔴 3. Show the specific error from the server
                alert('❌ Login failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            alert('🌐 Network error: ' + err.message);
        }
    });
