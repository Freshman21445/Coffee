<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <!-- 🔴 FIXED PATH: Removed leading slash -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body style="padding: 2rem; max-width: 400px; margin: 2rem auto;">
    <div class="card-3d" style="padding: 2rem;">
        <h1>Login</h1>
        <form id="login-form">
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Login</button>
        </form>
        <p style="margin-top:1rem;">Don't have an account? <a href="register.html">Register</a></p>
    </div>
    <script>
        // 🔴 Your Worker URL (corrected)
        const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(WORKER_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('balance', data.balance);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        });
    </script>
</body>
</html>
