<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <script>
        (function () {
            var t = localStorage.getItem("thecoffee-theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/main.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            padding: 2rem 1.5rem;
            width: 100%;
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .login-bonus {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 1rem;
            padding: 0.5rem;
            background: var(--card-bg-alt);
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body class="page-body">
    <div class="login-container">
        <div class="card-3d login-card">
            <h1>☕ Login</h1>
            <form id="login-form">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div class="login-footer">
                Don't have an account? <a href="register.html">Register</a>
            </div>
            <div class="login-bonus">
                🎉 New users get 1,000 ETB free!
            </div>
        </div>
    </div>

    <script src="static/js/theme.js"></script>
    <script src="static/js/interactive.js"></script>

    <script>
        const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(WORKER_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                // ✅ Check if login was successful
                if (data.success === true) {
                    // Save user data
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('balance', data.balance);
                    // ✅ Redirect to the app
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Login failed: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('🌐 Network error: ' + err.message);
            }
        });
    </script>
</body>
</html>
