<script>
    // Auto-attach the form token to every POST form on the page, so
    // individual page templates don't each need a hidden input for it.
    (function () {
        var token = "05f1b4dee40ac81a6c8df4df0d768381b245d57dce580afc062f4b033fc3ee56";
        window.FORM_TOKEN = token;
        document.querySelectorAll("form").forEach(function (form) {
            var method = (form.getAttribute("method") || "GET").toUpperCase();
            if (method !== "POST") return;
            if (form.querySelector('input[name="csrf_token"]')) return;
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = "csrf_token";
            input.value = token;
            form.appendChild(input);
        });
    })();
</script>

    document.getElementById("me-logout-link").addEventListener("click", (e) => {
        // Logout should break out of the iframe entirely, back to the full auth page.
        e.preventDefault();
        if (window.parent && window.parent !== window) {
            window.parent.location.href = "/logout";
        } else {
            window.location.href = "/logout";
        }
    });
</script>

    <script>
    // 🔴 CHANGE THIS: Replace with your actual Worker URL
    const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

    async function loadBalance() {
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const res = await fetch(WORKER_URL + '/api/balance?userId=' + userId);
            const data = await res.json();
            
            // Update the balance display
            const balanceElement = document.querySelector('[data-counter]');
            if (balanceElement) {
                balanceElement.textContent = data.balance + ' ETB';
            }
        } catch (err) {
            console.error('Failed to load balance:', err);
        }
    }

    // Load balance when page loads
    loadBalance();
    </script>
