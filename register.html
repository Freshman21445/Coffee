<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <base href="/Coffee/">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="padding: 2rem; max-width: 400px; margin: 2rem auto;">
    <div class="card-3d" style="padding: 2rem;">
        <h1>Create Account</h1>
        <form id="register-form">
            <label>Username</label>
            <input type="text" id="username" required>
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Register</button>
        </form>
        <p style="margin-top:1rem;">Already have an account? <a href="login.html">Login</a></p>
        <p style="font-size:0.8rem; color:var(--text-light); margin-top:1rem;">🎉 Free 1,000 ETB bonus on registration!</p>
    </div>
    <script>
        // 🔴 CHANGE THIS: Replace with your actual Worker URL
        const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(WORKER_URL + '/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('✅ Account created! You have 1,000 ETB bonus. Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        });
    </script>
</body>
</html>
