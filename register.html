<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register</title>
    <script>
        (function () {
            var t = localStorage.getItem("thecoffee-theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/main.css">
    <style>
        .register-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            padding: 2rem 1.5rem;
            width: 100%;
        }
        .register-card h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .register-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .register-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .register-bonus {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 1rem;
            padding: 0.5rem;
            background: var(--card-bg-alt);
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body class="page-body">
    <div class="register-container">
        <div class="card-3d register-card">
            <h1>☕ Create Account</h1>
            <form id="register-form">
                <label>Username</label>
                <input type="text" id="username" placeholder="Your name" required>
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
            <div class="register-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
            <div class="register-bonus">
                🎉 You get 1,000 ETB free on registration!
            </div>
        </div>
    </div>

    <script src="static/js/theme.js"></script>
    <script src="static/js/interactive.js"></script>

    <script>
        const WORKER_URL = 'https://little-wood-f0d3.abrahamtariku1997.workers.dev';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(WORKER_URL + '/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('✅ Account created! You have 1,000 ETB bonus. Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        });
    </script>
</body>
</html>
